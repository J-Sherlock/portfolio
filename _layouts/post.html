---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.categories %}
      <span class="post-categories">
        {% for category in page.categories %}
        <a href="#" class="category">{{ category }}</a>
        {% endfor %}
      </span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">{{ content }}</div>

  <!-- Social Share Buttons -->
  <div class="social-share">
    <h3>Share this post:</h3>
    <a
      href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}"
      target="_blank"
      class="share-btn linkedin"
    >
      Share on LinkedIn
    </a>

    <a
      href="https://twitter.com/intent/tweet?url={{ site.url }}{{ page.url }}&text={{ page.title }}"
      target="_blank"
      class="share-btn twitter"
    >
      Share on Twitter
    </a>

    <a
      href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}"
      target="_blank"
      class="share-btn facebook"
    >
      Share on Facebook
    </a>
  </div>
</article>
